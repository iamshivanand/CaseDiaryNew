services:
  # 1. Web Application & API Server (Advocase Command Center)
  web:
    build:
      context: ./casediary-web
      dockerfile: Dockerfile
    container_name: casediary-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://casediary_admin:casediary_secure_password@postgres:5432/casediary_db
      JWT_SECRET: advocase_casediary_super_secure_jwt_secret_key_2026
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

  # 2. PostgreSQL Database for Advocate Accounts, Chambers, and Cases
  postgres:
    image: postgres:16-alpine
    container_name: casediary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: casediary_admin
      POSTGRES_PASSWORD: casediary_secure_password
      POSTGRES_DB: casediary_db
    ports:
      - "5432:5432"
    volumes:
      - casediary_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casediary_admin -d casediary_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. pgAdmin 4 - Visual Browser Database Management (http://localhost:5050)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: casediary-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@casediary.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - casediary_pgadmin_data:/var/lib/pgadmin

volumes:
  casediary_pgdata:
  casediary_pgadmin_data:
